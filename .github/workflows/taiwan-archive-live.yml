name: Taiwan archive live diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic scope
        required: true
        type: choice
        options:
          - representatives
          - early-2021
          - target-2021-08
          - backfill
        default: representatives

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run representative live diagnostic
        if: inputs.mode == 'representatives'
        run: python scripts/diagnose_taiwan_orders_archive.py

      - name: Diagnose 2021-01 through 2021-08 once
        if: inputs.mode == 'early-2021'
        continue-on-error: true
        run: python scripts/update_taiwan_orders_archive.py --diagnose-early-2021 --end 2021-08

      - name: Recheck the single parser-blocked legacy month
        if: inputs.mode == 'target-2021-08'
        run: python scripts/update_taiwan_orders_archive.py --start 2021-08 --end 2021-08 --period 2021-08

      - name: Build initial strict snapshot
        if: inputs.mode == 'backfill'
        run: python scripts/update_taiwan_orders_archive.py --start 2022-08 --end 2026-07

      - name: Upload normalized snapshot
        if: inputs.mode == 'backfill'
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-orders-archive-snapshot
          path: |
            data/taiwan_export_orders_archive.csv
            data/taiwan_export_orders_archive_manifest.json
